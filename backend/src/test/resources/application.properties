# Test Profile Configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:careerforge_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in test generates tables directly from entities in-memory
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway during tests so test execution is self-contained and fast
spring.flyway.enabled=false

# Test Security & JWT Secrets
app.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.security.jwt.expiration-ms=3600000

# Test Storage Directory
app.storage.upload-dir=target/test-uploads

# Test Rate Limiting Capacities
app.rate-limit.auth.capacity=10
app.rate-limit.ai.capacity=5
app.rate-limit.general.capacity=100
