spring.application.name=careerforge-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# Database Connection Configuration (MySQL 8 + HikariCP)
# Environment variable overrides supported:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerforge_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:careerforge_secure_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
# - maximum-pool-size: limits active connections to avoid overwhelming the DB
# - minimum-idle: keeps baseline connections ready for incoming traffic
# - connection-timeout: fail fast (in ms) if a connection cannot be acquired
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA & Hibernate Configuration
# Note: 'validate' ensures Hibernate checks that our entities match the
# database schema created deterministically by Flyway.
# ===================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# Flyway Database Migration Configuration
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Security & JWT Configuration
# ===================================================================
app.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Google Gemini Generative AI Configuration
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

